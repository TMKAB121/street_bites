name: Terraform Apply

on:
  push:
    branches: [main] # production-apply gate — deliberately not `develop` (this repo's GitHub default/integration branch); promote via a develop -> main PR/merge when ready to deploy infra
    paths:
      - 'terraform/**'

permissions:
  id-token: write # required for OIDC
  contents: read

jobs:
  apply:
    runs-on: ubuntu-latest
    # Gate infra changes behind a reviewed GitHub Environment — merging to
    # main queues the apply, but a required reviewer (configure this in the
    # repo's environment settings) must approve before it actually runs.
    environment: production-infra
    env:
      # See terraform-plan.yml's comment — same repo variables + secrets,
      # same reasons.
      TF_VAR_s3_bucket_name: ${{ vars.S3_BUCKET_NAME }}
      TF_VAR_resend_api_key: ${{ secrets.RESEND_API_KEY }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.5'

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform init
        run: terraform init

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false
