name: Terraform Plan

on:
  pull_request:
    paths:
      - 'terraform/**'

permissions:
  id-token: write # required for OIDC
  contents: read
  pull-requests: write # to post the plan as a PR comment

jobs:
  plan:
    runs-on: ubuntu-latest
    env:
      # terraform.tfvars is gitignored (holds no secrets, just the bucket
      # name, but isn't committed) — CI supplies it via TF_VAR_* instead.
      # Add S3_BUCKET_NAME as a repository variable (Settings → Secrets and
      # variables → Actions → Variables). CLOUDFLARE_API_TOKEN is a repo
      # *secret* (Zone:Read + DNS:Edit on the street-bites.org zone) — the
      # cloudflare provider reads it from the environment (see backend.tf).
      TF_VAR_s3_bucket_name: ${{ vars.S3_BUCKET_NAME }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
    defaults:
      run:
        working-directory: terraform/environments/prod

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: '~1.5'

      # Assumes gha-terraform-role via GitHub OIDC — no long-lived AWS keys.
      # See terraform/bootstrap/oidc.tf; this role is trusted for both
      # pull_request and push-to-main subjects (accepted first-cut
      # simplification — see that file's comments).
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Terraform fmt
        run: terraform fmt -check -recursive ../../

      - name: Terraform init
        run: terraform init

      - name: Terraform plan
        id: plan
        run: terraform plan -no-color -input=false
        continue-on-error: true

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        env:
          PLAN: "${{ steps.plan.outputs.stdout }}"
        with:
          script: |
            const output = `#### Terraform Plan (\`environments/prod\`)
            \`\`\`
            ${process.env.PLAN}
            \`\`\`
            `;
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: output,
            });

      - name: Fail if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
