name: steet-bites
recipe: laravel
config:
  php: '8.3'
  via: nginx
  webroot: public
  database: mariadb:10.11
  cache: redis:7
  xdebug: false

services:

  appserver:
    build_as_root:
      - curl -fsSL https://deb.nodesource.com/setup_20.x | bash -
      - apt-get install -y nodejs
    overrides:
      environment:
        APP_LOG: errorlog

  database:
    creds:
      user: steet_bites
      password: steet_bites
      database: steet_bites
    portforward: 3306
    # Create the test database (used by phpunit.xml) on every start. Idempotent
    # via IF NOT EXISTS; the schema/data inside it are managed automatically by
    # Laravel's RefreshDatabase at test time, so it only needs to exist + be
    # grantable to the app user. Waits for mysqld to accept connections first.
    run_as_root:
      - |
        until mysqladmin -uroot ping --silent 2>/dev/null; do sleep 1; done
        mysql -uroot -e "CREATE DATABASE IF NOT EXISTS steet_bites_testing;
          GRANT ALL PRIVILEGES ON steet_bites_testing.* TO 'steet_bites'@'%';
          FLUSH PRIVILEGES;"

  cache:
    portforward: 6379

  node:
    type: node:20
    # The Lando proxy will not reliably route to Vite's custom port, so the
    # browser hits Vite directly on the published host port 5173. ssl: true makes
    # Lando issue a CA-trusted *.lndo.site cert (mounted at /certs in the
    # container) so Vite can serve HTTPS — required because the app is HTTPS and
    # browsers block mixed (http) content. sslExpose: false = no extra SSL port;
    # we publish 5173 ourselves.
    ssl: true
    sslExpose: false
    overrides:
      environment:
        NODE_ENV: development
      ports:
        - '5173:5173'

  reverb:
    type: lando
    services:
      image: devwithlando/php:8.3-fpm-7
      command: >-
        bash -c "
          until [ -f /app/artisan ]; do
            echo '[reverb] Waiting for /app/artisan...'; sleep 3;
          done &&
          php /app/artisan reverb:start
            --host=0.0.0.0
            --port=8080
            --no-interaction
        "
      # Pin host 8080 -> container 8080 explicitly. Lando's `portforward: 8080`
      # does NOT guarantee the host port (it assigned a random one), which broke
      # the browser's VITE_REVERB_HOST=localhost:8080 path. An explicit compose
      # mapping is deterministic.
      ports:
        - '8080:8080'

  mailpit:
    type: mailpit
    mailFrom:
      - appserver
    # Publish the Mailpit web UI to the host at http://localhost:8025. Lando's
    # mailpit service serves the UI on container port 80 (8025 is NOT the UI),
    # so map host 8025 -> container 80. Explicit ports (not portforward) for a
    # deterministic host port — same rationale as the reverb service above.
    overrides:
      ports:
        - '8025:80'

proxy:
  reverb:
    - reverb.steet-bites.lndo.site:8080
  mailpit:
    # Mailpit's web UI is on container port 80 (Lando's default proxy target),
    # so no explicit port suffix is needed here.
    - mailpit.steet-bites.lndo.site
  # No node/Vite proxy entry: the Lando proxy will not route Vite's custom port
  # (Traefik 404). Vite is reached directly on the published HTTPS port 5173
  # (see the node service's ssl/ports config and vite.config.js).

tooling:
  php:
    service: appserver
    cmd: php
  composer:
    service: appserver
    cmd: composer
  artisan:
    service: appserver
    cmd: php /app/artisan
    description: Run an artisan command
  npm:
    service: node
    cmd: npm
  node:
    service: node
    cmd: node
  npx:
    service: node
    cmd: npx
  vite:
    service: node
    cmd: npx vite
    description: Run Vite commands
  queue:work:
    service: appserver
    cmd: php /app/artisan queue:work redis --tries=3
    description: Start a Redis queue worker (foreground)
  mariadb:
    service: database
    cmd: mariadb -u steet_bites -psteet_bites steet_bites
    description: Open a MariaDB shell
  redis-cli:
    service: cache
    cmd: redis-cli
    description: Open a Redis CLI shell
  pint:
    service: appserver
    cmd: ./vendor/bin/pint
    description: Run Laravel Pint code style fixer
  pest:
    service: appserver
    cmd: ./vendor/bin/pest
    description: Run the Pest test suite
