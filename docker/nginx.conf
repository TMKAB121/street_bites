server {
    listen 8080;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # Don't leak the exact nginx version in the Server header / error pages.
    server_tokens off;

    # TruckEditor::MAX_UPLOAD_KB is 5120 (5 MiB); leave headroom.
    client_max_body_size 10m;

    # Compress text responses (HTML is included by default once gzip is on) —
    # the built JS/CSS bundles are ~4x smaller gzipped, and nothing upstream
    # compresses for us (the ALB passes bytes through as-is).
    gzip on;
    gzip_vary on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/javascript
        text/plain;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Vite fingerprints every filename under /build (a changed file is a new
    # URL), so these are safe to cache forever.
    location /build/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Brand assets are stable but NOT fingerprinted — a week keeps repeat
    # visits free without a rename dance when one does change.
    location /images/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
    }

    location = /favicon.ico {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }
    location = /favicon.svg {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }
    location = /apple-touch-icon.png {
        add_header Cache-Control "public, max-age=604800";
        access_log off;
        log_not_found off;
    }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        include fastcgi_params;
        fastcgi_pass unix:/run/php-fpm.sock;
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }
}
