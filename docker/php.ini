; App PHP overrides, dropped into conf.d and parsed at startup (loaded after the
; base php.ini). Keep this minimal — the base image's production defaults stand
; unless there's a reason to override.

; Don't advertise PHP (drops the X-Powered-By response header + the version
; easter-egg query strings).
expose_php = Off

; Upload limits. The php:8.3-fpm-alpine base ships NO php.ini, so PHP's
; compiled-in defaults apply (upload_max_filesize=2M, post_max_size=8M) — under
; those, a 2-5 MB photo passes the app's validation (TruckEditor::MAX_UPLOAD_KB
; is 5120) but dies at the PHP layer, which surfaces as a 302 from Livewire's
; upload endpoint and a cryptic JSON.parse error in the browser. Size these to
; the app's real caps: 6M gives headroom over the 5 MB app limit; post_max_size
; matches nginx's client_max_body_size (10m) and covers multipart overhead.
; Lando is unaffected (its recipe sets 100M/100M — why this never repro'd locally).
upload_max_filesize = 6M
post_max_size = 10M
