[www]
user = www-data
group = www-data

listen = /run/php-fpm.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

; Fargate tasks are small and short-lived; dynamic sizing avoids over-committing
; workers on the smallest task CPU/mem allocations while still handling bursts.
pm = dynamic
pm.max_children = 12
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 6

clear_env = no
catch_workers_output = yes
decorate_workers_output = no
